# Yerel geliştirme için RabbitMQ ve Redis (rate limiter). Yönetim arayüzü: http://localhost:15672 (guest / guest)
# Veri kalıcı değildir; kuyruklar API açılışında yeniden oluşturulur.
services:
  rabbitmq:
    image: rabbitmq:4-management
    user: rabbitmq # Docker Desktop (Windows) üzerinde root ile .erlang.cookie izin hatası veriyor
    ports:
      - "5672:5672"
      - "15672:15672"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
